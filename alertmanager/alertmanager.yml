route:
  receiver: telegram
  group_by: ["alertname", "server"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_token
        chat_id: 123456789        # replace with YOUR chat id
        send_resolved: true
