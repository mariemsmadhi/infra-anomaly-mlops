global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["192.168.56.11:9100"]
        labels:
          instance_name: "web01"
      - targets: ["192.168.56.12:9100"]
        labels:
          instance_name: "db01"

  - job_name: "anomaly-api"
    static_configs:
      - targets: ["api:8000"]
